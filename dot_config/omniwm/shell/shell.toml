
[profiles]

[profiles.default]
# Dark neutral palette with an orange accent: the focused workspace stays
# readable on a blue wallpaper (the native accent is blue).
theme = "monolith"
center = []
leading = ["workspaces"]
trailing = []

[profiles.default.workspaceBar]
fullWidth = false
position = "belowMenuBar"
reserveLayoutSpace = true
height = 24
# Solid-ish bar (the default profile makes it fully transparent) so labels
# stay readable over any wallpaper.
backgroundOpacity = 0.85
showItemBackgrounds = true
